# Bộ câu hỏi gán nhãn tay cho benchmark truy hồi RAG (python -m rag.benchmark).
#
# Bản đầu do Claude soạn từ kiến thức chung về Huế, QID lấy từ
# data/staged/wikidata.json. Mọi câu đang `reviewed: false`: người làm đồ án
# kiểm lại nhãn (địa danh đúng, từ khoá có thật trong bài Wikipedia) rồi mới
# đổi thành true. Báo cáo benchmark cảnh báo khi còn câu chưa kiểm duyệt.
#
# Trường:
#   id              duy nhất, không đổi khi sửa câu (kết quả cũ tham chiếu theo id)
#   query           câu người dùng thật có thể hỏi
#   type            fact          hỏi một chi tiết, thường có answer_keywords
#                   descriptive   hỏi chung về một địa danh, có nêu tên
#                   paraphrase    mô tả địa danh mà không nêu tên (BM25 khó)
#                   multi         nhiều địa danh cùng đúng; đo thêm Recall@k
#                   no_diacritics gõ không dấu, như người dùng thật hay gõ
#   relevant        mọi địa danh mà chunk của nó được coi là đúng (qid bắt buộc,
#                   name chỉ để người đọc)
#   answer_keywords (tuỳ chọn) chunk đúng phải chứa đủ các chuỗi này, không phân
#                   biệt hoa thường. Chỉ ghi chuỗi chắc chắn có trong bài Wikipedia.
#   category        (tuỳ chọn) truyền vào filter category của retriever
#   reviewed        true khi người đã kiểm nhãn
#
# Mục tiêu: 50–100 câu, mỗi loại ít nhất 8 câu. Viết thêm câu từ câu hỏi
# thật của người dùng thử nếu có.

