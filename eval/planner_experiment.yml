# Thực nghiệm bộ lập lịch thích ứng thời tiết (python -m planner.experiment run).
#
# Mỗi ngày trong các giai đoạn dưới đây là một chuyến đi. Lập lịch trên dự báo
# phát hành trước `lead_days` ngày (Open-Meteo Previous Runs), rồi chấm trên
# thời tiết đã xảy ra (ERA5). So ba biến thể trên cùng tập địa điểm:
#   aware    bộ lập lịch có thời tiết, dùng dự báo
#   baseline cùng bộ lập lịch, tắt thời tiết (baseline trong CLAUDE.md)
#   oracle   bộ lập lịch có thời tiết, biết trước thời tiết thật (cận trên)

# Mười điểm chính, nhiều hơn số điểm đi được trong một ngày để bộ lập lịch phải
# chọn. QID Wikidata ổn định qua các lần nạp lại DB.
places:
  - Q10769129  # Hoàng thành Huế
  - Q975568    # Chùa Thiên Mụ
  - Q7481171   # Lăng Tự Đức
  - Q7818621   # Lăng Khải Định
  - Q7481070   # Lăng Minh Mạng
  - Q5929149   # Bảo tàng Cổ vật Cung đình Huế
  - Q97273263  # Chợ Đông Ba
  - Q10752407  # Cầu Trường Tiền
  - Q10840433  # Đàn Nam Giao
  - Q10751137  # Cung An Định

hotel: [16.4637, 107.5909]  # trung tâm Huế, bờ nam sông Hương
transport_mode: motorbike
day_start: "08:00"
day_end: "18:00"
max_places_per_day: 4
lead_days: 1  # 1–3: tầng theo giờ; 4–10: tầng theo ngày

# Mùa mưa Huế (tháng 9–12), nơi thời tiết ảnh hưởng lịch nhiều nhất.
periods:
  - ["2024-09-01", "2024-12-31"]
  - ["2025-09-01", "2025-12-31"]

scenarios:
  - {name: "1 ngày", trip_days: 1, step_days: 1}
  - {name: "2 ngày", trip_days: 2, step_days: 2}
